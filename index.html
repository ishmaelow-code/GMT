
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Accra Clock & Weather</title>

<style>
:root {
  --bg: #07111d;
  --panel: #101f30;
  --line: rgba(148,174,199,.20);
  --text: #edf4fb;
  --muted: #9db0c3;
  --accent: #59c3d8;
  --green: #54d6a0;
  --amber: #f2bd63;
  --red: #ff8585;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: auto;
  background: transparent;
}

body {
  font-family: Inter, "Segoe UI", Arial, sans-serif;
  color: var(--text);
}

/* Main card - background restricted to card */
.widget {
  width: 100%;
  max-width: 500px;
  margin: 0 auto;
  padding: 14px;
  background: linear-gradient(135deg,#0b1928,#081321);
  border: 1px solid var(--line);
  border-radius: 12px;
  box-shadow: 0 5px 15px rgba(0,0,0,.15);
}

.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 9px;
}

.mark {
  width: 32px;
  height: 32px;
  border-radius: 9px;
  display: grid;
  place-items: center;
  background: rgba(89,195,216,.13);
  border: 1px solid rgba(89,195,216,.35);
  color: var(--accent);
  font-size: 18px;
}

.eyebrow {
  color: var(--muted);
  font-size: 9px;
  letter-spacing: .14em;
  font-weight: 700;
}

h1 {
  margin: 2px 0 0;
  font-size: 15px;
}

.live {
  display: flex;
  align-items: center;
  gap: 6px;
  color: #b8e9d5;
  font-size: 9px;
  font-weight: 700;
  border: 1px solid rgba(84,214,160,.25);
  background: rgba(84,214,160,.08);
  border-radius: 99px;
  padding: 5px 8px;
}

.dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--green);
}

.grid {
  display: grid;
  grid-template-columns: repeat(2,minmax(0,1fr));
  gap: 9px;
}

.panel {
  min-width: 0;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: linear-gradient(145deg,#14283b,#0d1d2d);
  padding: 12px;
}

.panel-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 5px;
}

.label {
  color: var(--muted);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .12em;
}

.tag {
  color: #a8c5d8;
  font-size: 9px;
  border: 1px solid var(--line);
  border-radius: 99px;
  padding: 3px 6px;
  white-space: nowrap;
}

.time {
  font-variant-numeric: tabular-nums;
  font-size: clamp(28px,5vw,43px);
  line-height: 1.1;
  font-weight: 650;
  letter-spacing: -.04em;
  margin: 14px 0 5px;
}

.date {
  color: #d3dfeb;
  font-size: 11px;
}

.zone {
  color: var(--muted);
  font-size: 9px;
  margin-top: 6px;
}

.weather-main {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 10px 0 12px;
}

.weather-icon {
  font-size: 38px;
  line-height: 1;
}

.temp {
  font-size: clamp(29px,4vw,40px);
  line-height: 1;
  font-weight: 650;
  letter-spacing: -.04em;
  font-variant-numeric: tabular-nums;
}

.condition {
  color: #d3dfeb;
  font-size: 11px;
  margin-top: 5px;
}

.metrics {
  display: grid;
  grid-template-columns: repeat(3,minmax(0,1fr));
  gap: 5px;
}

.metric {
  background: rgba(4,14,24,.36);
  border: 1px solid rgba(148,174,199,.12);
  border-radius: 7px;
  padding: 7px 5px;
  min-width: 0;
}

.metric-name {
  color: var(--muted);
  font-size: 8px;
  text-transform: uppercase;
}

.metric-value {
  margin-top: 4px;
  font-size: 12px;
  font-weight: 650;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

.footer {
  display: flex;
  justify-content: space-between;
  gap: 7px;
  flex-wrap: wrap;
  color: var(--muted);
  font-size: 9px;
  margin-top: 9px;
}

.status {
  display: flex;
  align-items: center;
  gap: 5px;
}

.status-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--green);
}

.status-dot.warn { background: var(--amber); }
.status-dot.error { background: var(--red); }

@media(max-width:420px) {
  .grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>
<main class="widget">

<header class="top">
  <div class="brand">
    <div class="mark">◷</div>
    <div>
      <div class="eyebrow">GHANA POLICE SERVICE</div>
      <h1>ACCRA CLOCK & WEATHER</h1>
    </div>
  </div>

  <div class="live">
    <span class="dot"></span> LIVE
  </div>
</header>

<section class="grid">

<article class="panel">
  <div class="panel-head">
    <div class="label">LOCAL TIME</div>
    <div class="tag">ACCRA · GMT</div>
  </div>

  <div class="time" id="clock">--:--:--</div>
  <div class="date" id="date">Loading date...</div>
  <div class="zone">Greenwich Mean Time · UTC +00:00</div>
</article>

<article class="panel">
  <div class="panel-head">
    <div class="label">CURRENT WEATHER</div>
    <div class="tag">ACCRA, GHANA</div>
  </div>

  <div class="weather-main">
    <div class="weather-icon" id="weatherIcon">⛅</div>
    <div>
      <div class="temp" id="temperature">--°C</div>
      <div class="condition" id="condition">
        Retrieving current conditions...
      </div>
    </div>
  </div>

  <div class="metrics">
    <div class="metric">
      <div class="metric-name">Feels like</div>
      <div class="metric-value" id="feels">--°C</div>
    </div>

    <div class="metric">
      <div class="metric-name">Humidity</div>
      <div class="metric-value" id="humidity">--%</div>
    </div>

    <div class="metric">
      <div class="metric-name">Wind speed</div>
      <div class="metric-value" id="wind">-- km/h</div>
    </div>
  </div>
</article>

</section>

<footer class="footer">
  <div class="status">
    <span class="status-dot" id="weatherStatusDot"></span>
    <span id="weatherStatus">Connecting...</span>
  </div>
  <div id="updated">Source: Open-Meteo</div>
</footer>

</main>

<script>
(function () {

const timeZone = 'Africa/Accra';
const $ = id => document.getElementById(id);

function updateClock() {
  const now = new Date();

  $('clock').textContent =
    new Intl.DateTimeFormat('en-GB', {
      timeZone,
      hour: '2-digit',
      minute: '2-digit',
      second: '2-digit',
      hour12: false
    }).format(now);

  $('date').textContent =
    new Intl.DateTimeFormat('en-GB', {
      timeZone,
      weekday: 'long',
      day: '2-digit',
      month: 'long',
      year: 'numeric'
    }).format(now);
}

updateClock();
setInterval(updateClock, 1000);

function weatherDescription(code, isDay) {
  if (code === 0)
    return [isDay ? '☀️' : '🌙', 'Clear sky'];

  if (code === 1) return ['🌤️', 'Mainly clear'];
  if (code === 2) return ['⛅', 'Partly cloudy'];
  if (code === 3) return ['☁️', 'Overcast'];

  if ([45,48].includes(code))
    return ['🌫️', 'Fog'];

  if ([51,53,55,56,57].includes(code))
    return ['🌦️', 'Drizzle'];

  if ([61,63,65,66,67].includes(code))
    return ['🌧️', 'Rain'];

  if ([71,73,75,77,85,86].includes(code))
    return ['🌨️', 'Snow'];

  if ([80,81,82].includes(code))
    return ['🌧️', 'Rain showers'];

  if ([95,96,99].includes(code))
    return ['⛈️', 'Thunderstorm'];

  return ['🌡️', 'Weather conditions'];
}

function setStatus(message, state) {
  $('weatherStatus').textContent = message;
  $('weatherStatusDot').className =
    'status-dot' + (state ? ' ' + state : '');
}

async function loadWeather() {

  const url =
    'https://api.open-meteo.com/v1/forecast?latitude=5.6037&longitude=-0.1870&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,weather_code,wind_speed_10m&timezone=Africa%2FAccra&wind_speed_unit=kmh';

  try {

    const response = await fetch(url, {
      cache: 'no-store'
    });

    if (!response.ok)
      throw new Error('Weather service error');

    const data = await response.json();
    const c = data.current;

    if (!c)
      throw new Error('Weather data unavailable');

    const [icon, description] =
      weatherDescription(c.weather_code, c.is_day);

    $('weatherIcon').textContent = icon;
    $('temperature').textContent =
      Math.round(c.temperature_2m) + '°C';

    $('condition').textContent = description;

    $('feels').textContent =
      Math.round(c.apparent_temperature) + '°C';

    $('humidity').textContent =
      Math.round(c.relative_humidity_2m) + '%';

    $('wind').textContent =
      Math.round(c.wind_speed_10m) + ' km/h';

    const stamp = c.time ? new Date(c.time) : new Date();

    $('updated').textContent =
      'Updated: ' +
      new Intl.DateTimeFormat('en-GB', {
        timeZone,
        hour: '2-digit',
        minute: '2-digit'
      }).format(stamp) +
      ' GMT · Open-Meteo';

    setStatus('Weather data connected', '');

  } catch (error) {

    setStatus('Weather unavailable — retrying', 'warn');

    $('condition').textContent =
      'Unable to retrieve current weather';

    $('updated').textContent =
      'Check internet connection';

    console.error(error);
  }
}

loadWeather();
setInterval(loadWeather, 10 * 60 * 1000);

})();
</script>

</body>
</html>
