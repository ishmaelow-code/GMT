<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GMT clock</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; }
  body {
    display: flex; flex-direction: column; justify-content: center;
    font-family: "Segoe UI", Arial, sans-serif;
    color: #f2f6ff;            /* use #14213d on a light dashboard */
    text-align: center;
  }
  #date { font-size: 14px; opacity: .8; }
  #time { font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: 1px; }
  #zone { font-size: 12px; opacity: .7; letter-spacing: 2px; }
</style>
</head>
<body>
  <div id="date"></div>
  <div id="time">--:--:--</div>
  <div id="zone">GMT</div>
<script>
  var tf = new Intl.DateTimeFormat("en-GB", { timeZone: "GMT", hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false });
  var df = new Intl.DateTimeFormat("en-GB", { timeZone: "GMT", weekday: "short", day: "2-digit", month: "short", year: "numeric" });
  function tick() {
    var n = new Date();
    document.getElementById("time").textContent = tf.format(n);
    document.getElementById("date").textContent = df.format(n);
  }
  tick(); setInterval(tick, 1000);
</script>
</body>
</html>
