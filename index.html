<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Accra Clock & Weather | Ghana Police Service</title>
<style>
  :root {
    --bg: #07111d;
    --panel: #101f30;
    --panel2: #14283b;
    --line: rgba(148, 174, 199, .20);
    --text: #edf4fb;
    --muted: #9db0c3;
    --accent: #59c3d8;
    --green: #54d6a0;
    --amber: #f2bd63;
    --red: #ff8585;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: transparent; }
  body {
    font-family: Inter, "Segoe UI", Arial, sans-serif;
    color: var(--text);
    padding: 10px;
  }
  .widget {
    width: 100%;
    max-width: 500px;
    margin: 0 auto;
    background: linear-gradient(135deg, #0b1928, #081321 75%);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: clamp(14px, 2.2vw, 22px);
    box-shadow: 0 12px 30px rgba(0,0,0,.22);
  }
  .top {
    display: flex; justify-content: space-between; align-items: center;
    gap: 12px; flex-wrap: wrap; margin-bottom: 16px;
  }
  .brand { display:flex; align-items:center; gap:10px; min-width:0; }
  .mark {
    width: 38px; height: 38px; border-radius: 11px;
    display:grid; place-items:center; flex:none;
    background: rgba(89,195,216,.13); border:1px solid rgba(89,195,216,.35);
    color: var(--accent); font-size:19px;
  }
  .eyebrow { color:var(--muted); font-size:10px; letter-spacing:.16em; font-weight:700; }
  h1 { margin:3px 0 0; font-size:clamp(14px,2vw,18px); letter-spacing:.04em; }
  .live {
    display:flex; align-items:center; gap:7px; color:#b8e9d5;
    font-size:10px; letter-spacing:.1em; font-weight:700;
    border:1px solid rgba(84,214,160,.25); background:rgba(84,214,160,.08);
    border-radius:99px; padding:7px 10px;
  }
  .dot { width:7px; height:7px; border-radius:50%; background:var(--green); box-shadow:0 0 10px var(--green); }
  .grid { display:grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap:12px; }
  .panel {
    min-width:0; border:1px solid var(--line); border-radius:13px;
    background:linear-gradient(145deg, rgba(20,40,59,.96), rgba(13,29,45,.96));
    padding:clamp(13px,2vw,19px);
  }
  .panel-head { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .label { color:var(--muted); font-size:10px; font-weight:700; letter-spacing:.14em; }
  .tag { color:#a8c5d8; font-size:10px; border:1px solid var(--line); border-radius:99px; padding:4px 8px; white-space:nowrap; }
  .time { font-variant-numeric:tabular-nums; font-size:clamp(32px,6vw,54px); line-height:1.1; font-weight:650; letter-spacing:-.045em; margin:18px 0 7px; }
  .date { color:#d3dfeb; font-size:13px; }
  .zone { color:var(--muted); font-size:11px; margin-top:7px; }
  .weather-main { display:flex; align-items:center; gap:14px; margin:12px 0 14px; }
  .weather-icon { font-size:clamp(38px,6vw,54px); line-height:1; }
  .temp { font-size:clamp(34px,5vw,48px); line-height:1; font-weight:650; letter-spacing:-.05em; font-variant-numeric:tabular-nums; }
  .condition { color:#d3dfeb; font-size:13px; margin-top:6px; }
  .metrics { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; }
  .metric { background:rgba(4,14,24,.36); border:1px solid rgba(148,174,199,.12); border-radius:9px; padding:10px 9px; min-width:0; }
  .metric-name { color:var(--muted); font-size:9px; letter-spacing:.08em; text-transform:uppercase; }
  .metric-value { margin-top:5px; font-size:15px; font-weight:650; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .footer { display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; color:var(--muted); font-size:10px; margin-top:13px; }
  .status { display:flex; align-items:center; gap:6px; }
  .status-dot { width:6px; height:6px; border-radius:50%; background:var(--green); }
  .status-dot.warn { background:var(--amber); }
  .status-dot.error { background:var(--red); }
  @media (max-width:560px) {
    .grid { grid-template-columns:1fr; }
    .time { margin-top:13px; }
  }
</style>
</head>
<body>
<main class="widget" aria-label="Accra local time and current weather">
  <header class="top">
    <div class="brand">
      <div class="mark" aria-hidden="true">◷</div>
      <div>
          <div class="live"><span class="dot"></span> LIVE DISPLAY</div>
  </header>

  <section class="grid">
    <article class="panel">
      <div class="panel-head">
        <div class="label">LOCAL TIME</div>
        <div class="tag">ACCRA · GMT</div>
      </div>
      <div class="time" id="clock">--:--:--</div>
      <div class="date" id="date">Loading date…</div>
        </article>

    <article class="panel">
      <div class="panel-head">
        <div class="label">CURRENT WEATHER</div>
        <div class="tag">ACCRA, GHANA</div>
      </div>
      <div class="weather-main">
        <div class="weather-icon" id="weatherIcon" aria-hidden="true">⛅</div>
        <div>
          <div class="temp" id="temperature">--°C</div>
          <div class="condition" id="condition">Retrieving current conditions…</div>
        </div>
      </div>
      <div class="metrics">
        <div class="metric">
          <div class="metric-name">Feels like</div>
          <div class="metric-value" id="feels">--°C</div>
        </div>
        <div class="metric">
          <div class="metric-name">Humidity</div>
          <div class="metric-value" id="humidity">--%</div>
        </div>
        <div class="metric">
          <div class="metric-name">Wind speed</div>
          <div class="metric-value" id="wind">-- km/h</div>
        </div>
      </div>
    </article>
  </section>

  <footer class="footer">
    <div class="status"><span class="status-dot" id="weatherStatusDot"></span><span id="weatherStatus">Connecting to weather service…</span></div>
    <div id="updated">Weather source: Open-Meteo</div>
  </footer>
</main>

<script>
(function () {
  const timeZone = 'Africa/Accra';
  const $ = (id) => document.getElementById(id);

  function updateClock() {
    const now = new Date();
    $('clock').textContent = new Intl.DateTimeFormat('en-GB', {
      timeZone, hour: '2-digit', minute: '2-digit', second: '2-digit',
      hour12: false
    }).format(now);
    $('date').textContent = new Intl.DateTimeFormat('en-GB', {
      timeZone, weekday: 'long', day: '2-digit', month: 'long', year: 'numeric'
    }).format(now);
  }
  updateClock();
  setInterval(updateClock, 1000);

  function weatherDescription(code, isDay) {
    if (code === 0) return isDay ? ['☀️', 'Clear sky'] : ['🌙', 'Clear sky'];
    if (code === 1) return ['🌤️', 'Mainly clear'];
    if (code === 2) return ['⛅', 'Partly cloudy'];
    if (code === 3) return ['☁️', 'Overcast'];
    if ([45, 48].includes(code)) return ['🌫️', 'Fog'];
    if ([51, 53, 55].includes(code)) return ['🌦️', 'Drizzle'];
    if ([56, 57].includes(code)) return ['🌧️', 'Freezing drizzle'];
    if ([61, 63, 65].includes(code)) return ['🌧️', 'Rain'];
    if ([66, 67].includes(code)) return ['🌧️', 'Freezing rain'];
    if ([71, 73, 75, 77].includes(code)) return ['🌨️', 'Snow'];
    if ([80, 81, 82].includes(code)) return ['🌧️', 'Rain showers'];
    if ([85, 86].includes(code)) return ['🌨️', 'Snow showers'];
    if ([95, 96, 99].includes(code)) return ['⛈️', 'Thunderstorm'];
    return ['🌡️', 'Weather conditions'];
  }

  function setStatus(message, state) {
    $('weatherStatus').textContent = message;
    $('weatherStatusDot').className = 'status-dot' + (state ? ' ' + state : '');
  }

  async function loadWeather() {
    const url = 'https://api.open-meteo.com/v1/forecast?latitude=5.6037&longitude=-0.1870&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,weather_code,wind_speed_10m&timezone=Africa%2FAccra&wind_speed_unit=kmh';
    try {
      const response = await fetch(url, { cache: 'no-store' });
      if (!response.ok) throw new Error('Weather service returned ' + response.status);
      const data = await response.json();
      const c = data.current;
      if (!c) throw new Error('Current weather data is unavailable');

      const [icon, description] = weatherDescription(c.weather_code, c.is_day);
      $('weatherIcon').textContent = icon;
      $('temperature').textContent = Math.round(c.temperature_2m) + '°C';
      $('condition').textContent = description;
      $('feels').textContent = Math.round(c.apparent_temperature) + '°C';
      $('humidity').textContent = Math.round(c.relative_humidity_2m) + '%';
      $('wind').textContent = Math.round(c.wind_speed_10m) + ' km/h';

      const stamp = c.time ? new Date(c.time) : new Date();
      $('updated').textContent = 'Weather updated: ' + new Intl.DateTimeFormat('en-GB', {
        timeZone, hour: '2-digit', minute: '2-digit'
      }).format(stamp) + ' GMT · Source: Open-Meteo';
      setStatus('Weather data connected', '');
    } catch (error) {
      setStatus('Weather data unavailable — retrying', 'warn');
      $('condition').textContent = 'Unable to retrieve current weather';
      $('updated').textContent = 'Check internet access or weather service availability';
      console.error(error);
    }
  }

  loadWeather();
  setInterval(loadWeather, 10 * 60 * 1000);
})();
</script>
</body>
</html>
